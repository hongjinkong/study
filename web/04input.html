<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--
        사용자에게 입력을 받기 위한 태그 input 태그
        - 모든 입력한 값을 묶어주는 역할 태그 form  태그
        - 입력하는 창은 input 태그
        - 사용자가 직접 입력하는 경우에는 text, password를 활용
        - 사용자가 선택을 통해서 입력하는 경우 checkbox, radio를 활용
    -->
    <form action="보낼서버의 주소">
        <span>아이디 : </span> <input type="text" name="id" placeholder="아이디를 입력해주세요"><br>
        <span>비밀번호 : </span> <input type="password" name="pw" placeholder="대소문자 포함해서 작성하세요" maxlength="10"><br>
        <span>비밀번호확인 : </span> <input type="password" name="pw2" placeholder="대소문자 포함해서 작성하세요" maxlength="10"><br>
        <input type="checkbox"> 동의1번 <input type="checkbox"> 동의2번<br>
        <input type="radio" name = "gender" value="men">남자 <input type="radio" name = "gender"value="women">여자<br>
        <input type="submit" value="가입하기">
    </form>
</body>
</html>
