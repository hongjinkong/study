<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--
        텍스트를 담당하는 태그
        1) 제목을 만드는 태그 h1~h6
            -  특징: 글자가 두껍고, 크기가 커지며 자동 줄바꿈 발생
        2 ) 문단만드는 태그 p
            - 특징 : 글자의 크기, 두께는 똑같다. 단, 줄바꿈이 발생 위아래 공백추가
        3)  특정 글자를 강조하는 태그
            - b태그 : 글자의 두께를 두껍게 하는 태그
            - strong 태그: 
        4) 글자를 클릭하면 다른 사이트로 이동하는 태그 a태그
            - 특징 : 반드시 속성으로 href를 넣어야 한다.
        5) 아무런 기능이 없는 span 태그
            - 특징 : 눈에 보이는 특징이 없다. -> 아무런 기능이 없다.
            - 사용처 : 문장내에 특정 글자들만 스타일을 입히고 싶을때 활용
            - 포인트 : 웹은 오직 태그로만 소통이 가능
        
    -->
        <h1>해당하는 문서의 대제목입니다.</h1>
        <h2>그다음 소제목입니다</h2>
        <h3>그다음 소제목입니다</h3>
        안녕하세세요 본문입니다.<br>
        <span>만나서 반갑습니다.</span>
        <p>첫번째 문단입니다.</p>
        <p>두번째 문단입니다.</p>
        <b>볼드체입니다.</b>
        <strong>강한체입니다.</strong>
        <a href = "https://www.naver.com">네이버로 이동</a>
</body>
</html>
